# Application Configuration
spring.application.name=calendrier-service
server.port=8082

# Database Configuration (MySQL / Workbench)
spring.datasource.url=jdbc:mysql://localhost:3306/st2i_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Ayouda123}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Config Server Configuration
spring.config.import=optional:configserver:http://localhost:8888

# Eureka Configuration
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# JWT Configuration
jwt.secret=${JWT_SECRET:K3y_2025_Sup3r_S3cr3t_JWT_T0k3n_!_v3r1_SeCur3_And_RanD0m_T0k3n!!}
jwt.expiration=86400000

# Feign Client Configuration
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=5000
user.service.url=http://localhost:9090

# Actuator Endpoints
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Logging Configuration
logging.level.org.springframework.security=DEBUG
logging.level.tn.st2i.calendrier=DEBUG
logging.level.org.springframework.cloud.config=DEBUG
logging.level.org.springframework.boot.context.config=DEBUG
