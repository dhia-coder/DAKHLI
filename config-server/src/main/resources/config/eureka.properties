# Configuration centralisée pour le serveur Eureka
spring.application.name=eureka
server.port=8761

# Configuration Eureka Server
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.server.enable-self-preservation=false

# Configuration du timeout
eureka.server.peer-node-read-timeout-ms=5000
eureka.server.peer-node-connect-timeout-ms=5000
eureka.server.peer-node-total-connections=1000
eureka.server.peer-node-total-connections-per-host=500

# Configuration pour éviter les erreurs de heartbeat
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90

# Configuration Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Logging Configuration
logging.level.com.netflix.eureka=DEBUG
logging.level.com.netflix.discovery=DEBUG 