# Configuration centralisée pour le microservice user
spring.application.name=user-service
server.port=9090

# Configuration de la base de données
spring.datasource.url=jdbc:postgresql://localhost:5432/userdb
spring.datasource.username=postgres
spring.datasource.password=postgres
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.springframework.boot.autoconfigure.jdbc=DEBUG

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT configuration
jwt.secret=K3y_2025_Sup3r_S3cr3t_JWT_T0k3n_!_v3r1_SeCur3_And_RanD0m_T0k3n!!
jwt.expiration=86400000

# Eureka
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Monitoring
management.endpoints.web.exposure.include=*

# Configuration Eureka
eureka.instance.prefer-ip-address=true

# Database Configuration
spring.jpa.properties.hibernate.format_sql=true

# Security Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/.well-known/jwks.json

# CORS Configuration
cors.allowed-origins=http://localhost:4200
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# Logging Configuration
logging.level.org.springframework.security=DEBUG
logging.level.tn.st2i.user_backend=DEBUG

# Configuration Actuator pour monitoring
management.endpoint.health.show-details=always 